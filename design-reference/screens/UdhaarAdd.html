<!doctype html>
<html lang="en">
<head>

<title>13b Add Udhaar — Apna Hisab design reference</title>
<link rel="stylesheet" href="../styles/fonts.css">
<link rel="stylesheet" href="../styles/apna-hisab.css">
<style>body{margin:0;background:#E9ECEA}</style>
</head>
<body>

<div class="ah">
<div style="position:absolute;inset:0"><iframe src="Udhaar.html" title="background" style="border:0;width:390px;height:844px;display:block" tabindex="-1"></iframe></div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Add Udhaar">
<div class="grab"></div>
<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="font-size:20px;font-weight:700">Add Udhaar</h2><a href="Udhaar.html" class="icon-btn" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px" role="radiogroup" aria-label="Direction">
<button class="opt on" role="radio" aria-checked="true" style="flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px"><span style="display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700"><svg width="18" height="18" viewBox="0 0 24 24" class="exp" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>I gave</span><span class="rs">You'll receive it back</span></button>
<button class="opt" role="radio" aria-checked="false" style="flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px"><span style="display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700"><svg width="18" height="18" viewBox="0 0 24 24" class="inc" aria-hidden="true"><path d="M17 7 7 17M16 17H7V8"></path></svg>I took</span><span class="rs">You'll need to pay</span></button>
</div>
<div class="field"><label class="lbl" for="ud-person">Person</label><div class="input"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color:#55615C"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><input id="ud-person" value="Ramesh" style="border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:#15201C"></div></div>
<div class="field"><label class="lbl" for="ud-amt">Amount</label><div class="input focus" style="height:60px"><span style="font-size:22px;font-weight:700;color:#55615C">₹</span><input id="ud-amt" inputmode="decimal" value="1,000" style="border:0;outline:0;font:inherit;font-size:24px;font-weight:800;flex:1;min-width:0;background:transparent;color:#15201C"></div></div>
<div class="chips"><button class="chip on">Today</button><button class="chip">Yesterday</button><button class="chip"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>Pick date</button><button class="chip"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Note</button></div>
<a href="Udhaar.html" class="btn btn-p">Save Udhaar</a>
</div>
</div>
