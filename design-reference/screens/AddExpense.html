<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 Add expense — Apna Hisab design reference</title>
<link rel="stylesheet" href="../styles/fonts.css">
<link rel="stylesheet" href="../styles/apna-hisab.css">
<style>body{margin:0;background:#E9ECEA}</style>
</head>
<body>

<div class="ah" style="background:#FFFFFF">
<div style="background:#FDEEE6;border-radius:0 0 30px 30px;padding-bottom:18px;flex:none">
<div class="hdr">
<a href="Home.html" class="icon-btn" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<div class="seg" style="flex:1;max-width:250px;margin:0 auto" role="tablist" aria-label="Transaction type">
<a href="AddIncome.html" role="tab" aria-selected="false" style="height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#55615C">+ Income</a>
<button class="on" role="tab" aria-selected="true" style="color:#C2410C">− Expense</button>
</div>
<span style="width:44px"></span>
</div>
<div style="text-align:center;padding-top:6px">
<p class="lbl">Add Expense · Amount</p>
<div class="amount-box" aria-label="Amount 300 rupees"><span class="cur exp">₹</span><span class="val exp">300</span><span class="caret" style="background:#C2410C"></span></div>
<p class="cap exp" style="display:flex;justify-content:center;gap:4px;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>Money going out</p>
</div>
</div>
<div class="body" style="gap:14px;padding-top:16px;padding-bottom:6px">
<div class="chips" style="justify-content:center">
<button class="chip" aria-label="Payment method: Cash"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Cash<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button class="chip" aria-label="Date: Today"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>Today, 03 Oct<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button class="chip on" aria-label="Note: CNG"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>CNG</button>
</div>
<p class="lbl">Category</p>
<div class="cats">
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v7a2 2 0 0 0 2 2 2 2 0 0 0 2-2V3M7 12v9M17 3c-2 0-3 2.5-3 5.5S15 12 17 12v9"></path></svg></span>Food</button>
<button class="cat on-e" aria-pressed="true"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3M7 7h4v4H7z"></path></svg></span>Fuel</button>
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Rent</button>
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span>Mobile</button>
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17H3v-4l2-5h14l2 5v4h-2M9 17h6"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg></span>Transport</button>
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.8L21 7H6"></path><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg></span>Shopping</button>
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"></rect><path d="M12 9v7M8.5 12.5h7"></path></svg></span>Medical</button>
<button class="cat"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg></span>More</button>
</div>
</div>
<div class="keypad" aria-label="Amount keypad">
<button>1</button><button>2</button><button>3</button>
<button>4</button><button>5</button><button>6</button>
<button>7</button><button>8</button><button>9</button>
<button aria-label="Decimal point">.</button><button>0</button><button aria-label="Delete digit"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7zM12 9l6 6M18 9l-6 6"></path></svg></button>
</div>
<div style="padding:4px 16px 18px;background:#FFFFFF"><a href="Home.html" class="btn btn-e">Save Expense</a></div>
</div>
</body>
</html>
