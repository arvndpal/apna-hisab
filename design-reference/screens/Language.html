<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 Language — Apna Hisab design reference</title>
<link rel="stylesheet" href="../styles/fonts.css">
<link rel="stylesheet" href="../styles/apna-hisab.css">
<style>body{margin:0;background:#E9ECEA}</style>
</head>
<body>

<div class="ah" style="background:#FFFFFF">
<div class="body" style="padding-top:64px;gap:20px">
<span class="ico p" style="width:56px;height:56px;border-radius:18px"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:4px">
<h1 style="font-size:30px;font-weight:800;line-height:1.15">Choose your language</h1>
<p lang="hi" style="font-size:20px;font-weight:600;color:#55615C">अपनी भाषा चुनें</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px" role="radiogroup" aria-label="Language">
<button class="opt on" role="radio" aria-checked="true" style="min-height:76px"><span class="radio on"></span><span style="flex:1"><span style="display:block;font-size:20px;font-weight:700">English</span><span class="rs">Income · Expense · Udhaar</span></span></button>
<button class="opt" role="radio" aria-checked="false" lang="hi" style="min-height:76px"><span class="radio"></span><span style="flex:1"><span style="display:block;font-size:20px;font-weight:700">हिन्दी</span><span class="rs">कमाई · खर्च · उधार</span></span></button>
</div>
<p class="cap">You can change this anytime in Settings · इसे बाद में सेटिंग्स में बदल सकते हैं</p>
<div style="flex:1"></div>
<a href="AppLock.html" class="btn btn-p">Continue</a>
</div>
</div>
</body>
