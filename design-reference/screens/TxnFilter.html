<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09b Filters — Apna Hisab design reference</title>
<link rel="stylesheet" href="../styles/fonts.css">
<link rel="stylesheet" href="../styles/apna-hisab.css">
<style>body{margin:0;background:#E9ECEA}</style>
</head>
<body>

<div class="ah">
<div style="position:absolute;inset:0"><iframe src="Transactions.html" title="background" style="border:0;width:390px;height:1010px;display:block" tabindex="-1"></iframe></div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Filters">
<div class="grab"></div>
<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="font-size:20px;font-weight:700">Filters</h2><button class="btn btn-g btn-sm" style="width:auto">Reset</button></div>
<div class="field"><p class="lbl">Date</p><div class="chips"><button class="chip">Today</button><button class="chip on">This week</button><button class="chip">This month</button><button class="chip"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>Custom</button></div></div>
<div class="field"><p class="lbl">Category</p><div class="chips"><button class="chip on">Fuel</button><button class="chip on">Food</button><button class="chip">Salary</button><button class="chip">Sales</button><button class="chip">Mobile</button><button class="chip">All categories</button></div></div>
<div class="field"><p class="lbl">Payment method</p><div class="chips"><button class="chip on">Cash</button><button class="chip">UPI</button><button class="chip">Card</button><button class="chip">Bank</button></div></div>
<div class="field"><p class="lbl">Amount</p>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<label class="input"><span class="ph">Min ₹</span><input aria-label="Minimum amount" inputmode="numeric" style="border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent"></label>
<label class="input"><span class="ph">Max ₹</span><input aria-label="Maximum amount" inputmode="numeric" style="border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent"></label>
</div></div>
<a href="Transactions.html" class="btn btn-p">Show 4 transactions</a>
</div>
</div>
</body>
</html>
